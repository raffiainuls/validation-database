[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-validator"
version = "1.0.0"
description = "Data validation tool for ensuring consistency across multiple database systems"
authors = [{name = "Your Name", email = "your.email@example.com"}]
readme = "readme.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "jupyter",
    "pytest",
    "black",
    "flake8",
]

[project.urls]
Homepage = "https://github.com/raffiainuls/validation-database"
Repository = "https://github.com/raffiainuls/validation-database.git"

[tool.setuptools.packages.find]
where = ["."]

[tool.uv]
# uv-specific configuration
dev-dependencies = [
    "jupyter",
    "pytest",
    "black",
    "flake8",
]

[tool.uv.sources]
# Optional: specify package sources if needed
# pandas = { index = "pypi" }